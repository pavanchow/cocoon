[package]
name = "cocoon"
version = "0.1.0"
edition = "2021"
description = "A small rootless Linux container runtime, built from scratch in Rust: it isolates a process with user, mount, pid, uts, and ipc namespaces, pivot_roots into a bundle rootfs, drops capabilities, sets no_new_privs, and installs a seccomp filter, all without root. Readable end to end."
license = "MIT"
repository = "https://github.com/pavanchow/cocoon"
keywords = ["container", "namespaces", "rootless", "cgroups", "runtime"]
categories = ["command-line-utilities", "virtualization", "os::linux-apis"]

[lib]
name = "cocoon"
path = "src/lib.rs"

[[bin]]
name = "cocoon"
path = "src/main.rs"

# The core (config, plan, lifecycle) is dependency-free. serde_json is used only
# by the MCP server (src/mcp.rs), where hand-rolling a full JSON parser would be
# error-prone; it is isolated to that one module and builds on every OS.
[dependencies]
serde_json = "1"

[dev-dependencies]
serde_json = "1"

# The actual isolation is Linux-only and uses nix, pulled in only when the target
# is Linux so macOS/other hosts still build and test the core.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["user", "mount", "sched", "process", "hostname", "fs", "signal", "resource"] }
libc = "0.2"
seccompiler = "0.4"
