name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the portable core
        run: |
          rustup update stable
          cargo build --verbose
          cargo test --verbose
      - name: Prove rootless isolation end to end
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static
          sh scripts/prove.sh
